name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
    # Perubahan web/dokumentasi tidak perlu membangun APK.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble APK (debug + release)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch penuh: step VT perlu commit docs & push balik ke main
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Keystore release disimpan sebagai GitHub Secret (base64), bukan di repo.
      - name: Siapkan keystore release
        id: keystore
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "have=yes" >> "$GITHUB_OUTPUT"
            echo "keystore release tersedia ✓"
          else
            echo "have=no" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret KEYSTORE_BASE64 belum ada — build release dilewati, hanya debug."
          fi

      - name: Unit test (parser AppOps & pemetaan status)
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon --console=plain --stacktrace

      - name: Build debug
        run: bash ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Build release (signed + minified)
        if: steps.keystore.outputs.have == 'yes'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Kumpulkan artefak + fingerprint
        id: artifact
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          NAME="AppsPerms-$VERSION"
          mkdir -p out

          DEBUG_APK=app/build/outputs/apk/debug/app-debug.apk
          cp "$DEBUG_APK" "out/$NAME-debug.apk"

          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "out/$NAME-release.apk"
            echo "signed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "signed=no" >> "$GITHUB_OUTPUT"
          fi

          # APK ini tidak punya native lib -> satu file jalan di semua ABI.
          # Blok di bawah otomatis bikin varian per-ABI kalau nanti ada .so.
          if unzip -l "$DEBUG_APK" | grep -qE 'lib/(arm|x86)'; then
            echo "native=yes" >> "$GITHUB_OUTPUT"
            sign_abi() {
              ABI="$1"; OUT="out/$NAME-$ABI.apk"
              cp "$DEBUG_APK" "$OUT"
              for OTHER in arm64-v8a armeabi-v7a x86 x86_64; do
                [ "$OTHER" != "$ABI" ] && zip -q -d "$OUT" "lib/$OTHER/*" >/dev/null 2>&1 || true
              done
              zip -q -d "$OUT" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' >/dev/null 2>&1 || true
              "$BT/zipalign" -f -p 4 "$OUT" "$OUT.aligned"
              KS="$RUNNER_TEMP/debug.keystore"
              keytool -genkeypair -keystore "$KS" -storepass android -keypass android \
                -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
              "$BT/apksigner" sign --ks "$KS" --ks-pass pass:android --key-pass pass:android \
                --ks-key-alias androiddebugkey --out "$OUT" "$OUT.aligned"
              rm -f "$OUT.aligned"
            }
            for ABI in arm64-v8a armeabi-v7a x86 x86_64; do sign_abi "$ABI"; done
          else
            echo "native=no" >> "$GITHUB_OUTPUT"
            cat > out/CATATAN-ABI.txt <<EOF
          $NAME tidak mengandung native library (.so) — semuanya kode Java/Kotlin.
          Artinya SATU APK ini jalan di semua arsitektur:
            - armeabi-v7a  (32-bit ARM)   OK
            - arm64-v8a    (64-bit ARM)   OK
            - x86 / x86_64 (emulator)     OK
          Jadi tidak perlu build terpisah per-ABI.
          EOF
          fi

          # Fingerprint sertifikat yang dipakai (buat didaftarkan di Google/Firebase)
          {
            echo "## Hasil build OverlayOps $VERSION"
            echo
            echo "| file | ukuran | sha256 |"
            echo "|---|---|---|"
            for f in out/*.apk; do
              printf '| %s | %s | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)" "$(sha256sum "$f" | cut -c1-32)…"
            done
            echo
            for f in out/*.apk; do
              echo "### Fingerprint: $(basename "$f")"
              echo '```'
              "$BT/apksigner" verify --print-certs "$f" 2>/dev/null \
                | grep -Ei "Signer #1 certificate (DN|SHA-1|SHA-256)" || echo "(tidak terbaca)"
              echo '```'
            done
            echo
            echo "versionName: \`$VERSION\` · commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

          # Catatan rilis (dipakai step Release + di-append step VirusTotal)
          {
            echo "APK **AppsPerms** — pengelola AppOps + Tuning via Shizuku."
            echo
            echo "- \`AppsPerms-$VERSION-release.apk\` → signed keystore resmi, di-minify (R8), **disarankan**"
            echo "- \`AppsPerms-$VERSION-debug.apk\` → buat troubleshooting"
            echo
            echo "| berkas | ukuran | sha256 |"
            echo "|---|---|---|"
            for f in out/*.apk; do
              printf '| `%s` | %s | `%s` |\n' "$(basename \"$f\")" "$(du -h \"$f\" | cut -f1)" "$(sha256sum \"$f\" | cut -d' ' -f1)"
            done
            echo
            echo "> ⚠️ **Mulai v1.3.0 nama paketnya berubah** (\`app.overlayops\` → \`app.appsperms\`). Uninstall versi lama dulu."
            echo
            echo "Situs: https://appsperms.haekal.web.id/ · data scan: \`docs/data/virustotal.json\`"
          } > out/release-notes.md

          ls -lh out

      - name: Scan VirusTotal & perbarui data situs (hanya rilis bertag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          set -uo pipefail
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          REL_APK="out/AppsPerms-$VERSION-release.apk"
          DBG_APK="out/AppsPerms-$VERSION-debug.apk"
          REL_SHA=$(sha256sum "$REL_APK" | cut -d' ' -f1)
          DBG_SHA=$(sha256sum "$DBG_APK" | cut -d' ' -f1)
          REL_MB=$(python3 -c "import os;print(round(os.path.getsize('$REL_APK')/1048576,2))")
          DBG_MB=$(python3 -c "import os;print(round(os.path.getsize('$DBG_APK')/1048576,2))")
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          V3=https://www.virustotal.com/api/v3
          PERMA="https://www.virustotal.com/gui/file/$REL_SHA"
          CHECKED=false; DET=0; TOT=0

          if [ -z "${VT_API_KEY:-}" ]; then
            echo "::warning::Secret VT_API_KEY belum diset — scan VirusTotal dilewati; hash & ukuran tetap diperbarui."
          else
            # Header v3 yang benar: X-Apikey (tanpa strip); -L wajib (www->api redirect)
            H="X-Apikey: $VT_API_KEY"
            J=$(curl -sL -H "$H" "$V3/files/$REL_SHA" || true)
            AID=""
            if jq -e '.data.attributes.last_analysis_stats' >/dev/null 2>&1 <<<"$J"; then
              echo "file sudah dikenal VirusTotal (hash sama) — pakai hasil terakhir"
            else
              POST=$(curl -sL -H "$H" -F file=@$REL_APK "$V3/files" || true)
              AID=$(jq -r '.data.id // empty' <<<"$POST")
              [ -n "$AID" ] || echo "::warning::submit VT gagal: $(jq -r '.error.message // "?"' <<<"$POST") — pakai hasil terakhir yang ada bila ada"
            fi
            if [ -n "$AID" ]; then
              for i in $(seq 1 20); do
                ST=$(curl -sL -H "$H" "$V3/analyses/$AID" | jq -r '.data.attributes.status // "?"')
                echo "analisis: $ST ($i/20)"
                [ "$ST" = "completed" ] && break
                sleep 15
              done
              J=$(curl -sL -H "$H" "$V3/files/$REL_SHA" || true)
            fi
            if jq -e '.data.attributes.last_analysis_stats' >/dev/null 2>&1 <<<"$J"; then
              # DET = malicious+suspicious; TOT = hanya engine yang benar-benar memutus
              # (timeout/failure/type-unsupported tidak dihitung supaya angka jujur)
              DET=$(jq -r '[(.data.attributes.last_analysis_stats.malicious // 0), (.data.attributes.last_analysis_stats.suspicious // 0)] | add' <<<"$J")
              TOT=$(jq -r '[.data.attributes.last_analysis_stats | (.malicious // 0) + (.suspicious // 0) + (.undetected // 0) + (.harmless // 0)] | add' <<<"$J")
              CHECKED=true
            fi
          fi

          # 1) data live untuk website (index.html & thanks.html membaca file ini).
          #    SELALU ditulis — hash & ukuran akurat walau scan VT dilewati
          #    (blok virustotal membawa checked:false, situs menampilkan fallback).
          jq -n --arg v "$VERSION" --arg now "$NOW" \
             --arg rfile "AppsPerms-$VERSION-release.apk" --arg dfile "AppsPerms-$VERSION-debug.apk" \
             --arg rsha "$REL_SHA" --arg dsha "$DBG_SHA" --argjson rmb "$REL_MB" --argjson dmb "$DBG_MB" \
             --argjson checked "$CHECKED" --argjson det "$DET" --argjson tot "$TOT" --arg perma "$PERMA" \
             '{updated_utc:$now, version:$v, generated_by:"GitHub Actions build.yml (otomatis tiap tag v*)",
               release:{file:$rfile, sha256:$rsha, size_mb:$rmb},
               debug:{file:$dfile, sha256:$dsha, size_mb:$dmb},
               virustotal:{checked:$checked, detected:$det, total:$tot, permalink:$perma, checked_utc:$now}}' \
             > docs/data/virustotal.json
          cp docs/data/virustotal.json out/virustotal.json

          # 2) kartu hasil scan (PNG) — hanya saat scan benar-benar jalan, supaya
          #    screenshot CLEAN yang ada tidak tertimpa kartu "belum tersedia"
          if [ "$CHECKED" = "true" ]; then
            if python3 -c "import PIL" 2>/dev/null || pip install --quiet pillow; then
              python3 docs/tools/make-vt-card.py --data docs/data/virustotal.json --out docs/images/virustotal-report.png \
                && cp docs/images/virustotal-report.png out/virustotal-report.png
            fi
          fi

          # 3) laporan ke catatan rilis
          {
            echo
            echo "### 🔐 Audit VirusTotal (scan otomatis CI)"
            if [ "$CHECKED" = "true" ]; then
              echo "- Hasil rilis ini: **$DET / $TOT**$( [ "$DET" -eq 0 ] && echo ' — CLEAN ✅')"
              echo "- Detail: $PERMA"
            else
              echo "- Scan otomatis **dilewati** (secret \`VT_API_KEY\` belum diset). Scan manual: $PERMA"
            fi
            echo "- SHA-256 release APK: \`$REL_SHA\`"
          } >> out/release-notes.md

          # 4) push balik data (+kartu jika ada) ke main
          #    (perubahan docs/ TIDAK memicu build APK — lihat paths-ignore)
          if true; then
            git add docs/data/virustotal.json
            [ -f out/virustotal-report.png ] && git add docs/images/virustotal-report.png
            if ! git diff --cached --quiet; then
              git -c user.name="AppsPerms CI" -c user.email="appsperms-ci@xykalnotkel.local" \
                  commit -q -m "docs: hasil scan VirusTotal & hash v$VERSION (otomatis CI)"
              git push "https://github.com/$GITHUB_REPOSITORY" HEAD:refs/heads/main \
                || echo "::warning::push docs gagal (main sudah bergeser?) — file tetap ada di artefak build."
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppsPerms-${{ github.run_number }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: Release (kalau push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.apk
            out/virustotal-report.png
            out/virustotal.json
          generate_release_notes: true
          body_path: out/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publikasikan situs ke Cloudflare Pages
        if: always() && !cancelled()
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: appsperms
        run: |
          # Situs kini di-serve Cloudflare Pages (appsperms.haekal.web.id).
          # Deploy tiap run supaya data/hash/kartu hasil step di atas langsung
          # tayang — juga saat commit-balik docs ke main.
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::notice::Secret CLOUDFLARE_API_TOKEN/ACCOUNT_ID belum diset — lewati publish Pages."
            exit 0
          fi
          npx --yes wrangler@3 pages deploy docs \
            --project-name="$CLOUDFLARE_PAGES_PROJECT" --branch=main --commit-dirty=true
